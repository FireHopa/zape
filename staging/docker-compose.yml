services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: zape_staging
      POSTGRES_USER: zape_staging
      POSTGRES_PASSWORD: zape_staging
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - zape_phase15_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zape_staging -d zape_staging"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - zape_phase15_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zape_phase15_postgres:
  zape_phase15_redis:
