# /etc/nginx/sites-available/casa-do-ads.conf
# Domínio canônico: bobia.com.br

server {
  listen 80;
  listen [::]:80;
  server_name bobia.com.br www.bobia.com.br;

  access_log /var/log/nginx/casa-do-ads.access.log zape_main;
  error_log  /var/log/nginx/casa-do-ads.error.log warn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  if ($host !~* ^(bobia\.com\.br|www\.bobia\.com\.br)$) { return 444; }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bobia.com.br www.bobia.com.br;

  if ($host !~* ^(bobia\.com\.br|www\.bobia\.com\.br)$) { return 444; }

  ssl_certificate     /etc/letsencrypt/live/bobia.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bobia.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ZAPE_SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  server_tokens off;
  access_log /var/log/nginx/casa-do-ads.access.log zape_main;
  error_log  /var/log/nginx/casa-do-ads.error.log warn;

  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 30s;
  reset_timedout_connection on;

  location = /health {
    limit_req zone=zape_health burst=10 nodelay;
    client_max_body_size 16k;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 10s;
  }

  location = /api/leads {
    limit_req zone=zape_public burst=20 nodelay;
    limit_conn zape_per_ip 10;
    client_max_body_size 512k;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 30s;
  }

  location = /webhooks/activecampaign {
    access_log /var/log/nginx/casa-do-ads.access.log zape_webhook;
    error_log /var/log/nginx/casa-do-ads.webhooks.error.log crit;
    limit_req zone=zape_public burst=60 nodelay;
    limit_conn zape_per_ip 20;
    client_max_body_size 1m;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 30s;
  }

  location = /webhooks/wa-cloud {
    access_log /var/log/nginx/casa-do-ads.access.log zape_webhook;
    error_log /var/log/nginx/casa-do-ads.webhooks.error.log crit;
    limit_req zone=zape_meta burst=200 nodelay;
    limit_conn zape_per_ip 30;
    client_max_body_size 2m;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 30s;
  }

  location ^~ /webhooks/ {
    access_log /var/log/nginx/casa-do-ads.access.log zape_webhook;
    error_log /var/log/nginx/casa-do-ads.webhooks.error.log crit;
    limit_req zone=zape_public burst=60 nodelay;
    limit_conn zape_per_ip 20;
    client_max_body_size 1m;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 30s;
  }

  location ~ ^/(admin|panel|regina|portugal|felipe|ana)/login$ {
    limit_req zone=zape_login burst=5 nodelay;
    limit_conn zape_per_ip 10;
    client_max_body_size 128k;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 30s;
  }

  location ~ ^/api/(admin|panel|regina|portugal|felipe|ana)/conversations/[0-9]+/(audio|attachments)$ {
    limit_conn zape_per_ip 10;
    client_max_body_size 26m;
    include /etc/nginx/snippets/zape-proxy-stream.conf;
    proxy_read_timeout 180s;
  }

  location / {
    limit_conn zape_per_ip 30;
    client_max_body_size 16m;
    include /etc/nginx/snippets/zape-proxy-common.conf;
    proxy_read_timeout 120s;
  }
}
