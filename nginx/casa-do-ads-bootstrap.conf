# Configuração temporária para emitir o primeiro certificado com Certbot webroot.
server {
  listen 80;
  listen [::]:80;
  server_name bobia.com.br www.bobia.com.br;

  access_log /var/log/nginx/casa-do-ads.access.log zape_main;
  error_log  /var/log/nginx/casa-do-ads.error.log warn;

  if ($host !~* ^(bobia\.com\.br|www\.bobia\.com\.br)$) { return 444; }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 503;
  }
}
