# Instalar em /etc/nginx/conf.d/zape-http.conf.
# Este arquivo é carregado no contexto `http` do Nginx.

map $http_upgrade $zape_connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=zape_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zape_public:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=zape_meta:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=zape_health:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=zape_per_ip:10m;

log_format zape_main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time request_id=$request_id';

# Formato dedicado: nunca registra o token legado presente em /webhooks/:token.
log_format zape_webhook '$remote_addr - [$time_local] "$request_method /webhooks/[redacted] $server_protocol" '
                        '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time request_id=$request_id';
